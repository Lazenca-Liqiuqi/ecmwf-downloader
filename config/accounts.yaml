# ECMWF账号池配置文件
#
# 此文件管理用于ECMWF CDS API的账号凭据
# 警告：请勿将此文件提交到版本控制系统（已加入.gitignore）
#
# 如何获取ECMWF账号：
# 1. 访问 https://cds.climate.copernicus.eu/
# 2. 注册账号并验证邮箱
# 3. 访问 https://cds.climate.copernicus.eu/api-how-to
# 4. 复制你的UID和Key

# ============================================================================
# 账号列表
# ============================================================================
accounts:
  # 主账号示例（请替换为真实凭据）
  - id: "account_1"
    uid: "your-uid-here"
    key: "your-api-key-here"
    status: "active"
    url: "https://cds.climate.copernicus.eu/api"
    used_count: 0
    last_used: null
    fail_count: 0

  # 备用账号示例（多账号轮换提高下载效率）
  # - id: "account_2"
  #   uid: "another-uid-here"
  #   key: "another-api-key-here"
  #   status: "active"
  #   url: "https://cds.climate.copernicus.eu/api"
  #   used_count: 0
  #   last_used: null
  #   fail_count: 0

  # 第三个账号示例
  # - id: "account_3"
  #   uid: "third-uid-here"
  #   key: "third-api-key-here"
  #   status: "active"
  #   url: "https://cds.climate.copernicus.eu/api"
  #   used_count: 0
  #   last_used: null
  #   fail_count: 0

# ============================================================================
# 账号池设置
# ============================================================================

# 连续失败多少次后自动禁用账号
# 当账号连续失败达到此阈值时，系统会自动将其状态设为"failed"
auto_disable_threshold: 5

# ============================================================================
# 账号状态说明
# ============================================================================
# - active: 账号可用，可以正常下载
# - failed: 账号连续失败多次，已被自动禁用（可以手动重新启用）
# - disabled: 账号被手动禁用（用于临时停止使用某个账号）
#
# 手动管理账号：
# - 临时禁用：将status改为"disabled"
# - 重新启用：将status改为"active"，并将fail_count设为0
# - 查看使用统计：查看used_count和last_used字段

# ============================================================================
# 使用建议
# ============================================================================
# 1. 多账号策略：建议配置3-5个账号，避免单个账号限流
# 2. 账号轮换：系统会自动轮换使用账号，均衡负载
# 3. 失败处理：连续失败的账号会被自动禁用，避免影响下载效率
# 4. 定期检查：定期查看last_used和fail_count，及时发现异常账号
