# ECMWF下载器默认配置文件
#
# 此文件定义应用程序的默认行为和参数
# 用户可以根据需要修改此文件，或创建自定义配置文件

# ============================================================================
# 下载任务配置
# ============================================================================
download:
  # 数据集类型（首期仅支持ERA5气压层数据）
  dataset: "reanalysis-era5-pressure-levels"

  # 要下载的气象变量列表
  # 可用变量：
  #   - u_component_of_wind: 纬向风分量
  #   - v_component_of_wind: 经向风分量
  #   - temperature: 温度
  #   - geopotential: 位势高度
  #   - relative_humidity: 相对湿度
  #   - specific_humidity: 比湿
  #   - vertical_velocity: 垂直速度
  #   - divergence: 散度
  #   - vorticity: 涡度
  variables:
    - "u_component_of_wind"
    - "v_component_of_wind"
    - "temperature"
    - "geopotential"

  # 时间范围配置
  years:
    - 2023
  months:
    - 1
    - 2
    - 3

  # 可选：指定具体日期（1-31），不指定则下载整月
  # days:
  #   - 1
  #   - 15

  # 可选：指定时间点，不指定则使用默认4个时间点
  # times:
  #   - "00:00"
  #   - "06:00"
  #   - "12:00"
  #   - "18:00"

  # 气压层配置（单位：hPa）
  # 可用值：1, 2, 3, 5, 7, 10, 20, 30, 50, 70, 100, 125, 150, 175, 200, 225, 250,
  #        300, 350, 400, 450, 500, 550, 600, 650, 700, 750, 775, 800, 825, 850,
  #        875, 900, 925, 950, 975, 1000
  pressure_levels:
    - 500
    - 850
    - 1000

  # 可选：区域范围 [北纬, 西经, 南纬, 东经]
  # 不指定则下载全球数据
  # 示例（中国区域）: [55, 70, 15, 140]
  # area:
  #   - 55    # 北纬边界
  #   - 70    # 西经边界
  #   - 15    # 南纬边界
  #   - 140   # 东经边界

  # 输出目录（绝对路径或相对路径）
  output_dir: "./data/downloads"

  # 输出文件格式
  output_format: "netcdf"

# ============================================================================
# 账号池配置
# ============================================================================
account_pool:
  # 账号池配置文件路径（单独文件，便于管理敏感信息）
  config_file: "./config/accounts.yaml"

  # 连续失败多少次后自动禁用账号
  auto_disable_threshold: 5

# ============================================================================
# 并发下载配置
# ============================================================================
concurrency:
  # 每批处理的任务数
  batch_size: 4

  # 最大并发线程数
  max_workers: 4

  # 批次间延迟（秒）
  batch_delay: 1.0

  # 单个任务最大重试次数
  max_retries: 3

  # 重试延迟（秒）
  retry_delay: 5.0

# ============================================================================
# 进度管理配置
# ============================================================================
progress:
  # 是否启用进度保存（支持断点续传）
  enabled: true

  # 进度文件路径
  file_path: "./data/download_progress.json"

  # 自动保存间隔（秒）
  auto_save_interval: 5

# ============================================================================
# 日志配置
# ============================================================================
logging:
  # 日志级别：DEBUG, INFO, WARNING, ERROR, CRITICAL
  level: "INFO"

  # 日志文件路径（不指定则仅输出到控制台）
  file_path: "./data/logs/ecmwf_downloader.log"

  # 是否输出到控制台
  console_output: true

  # 日志文件最大大小（字节，默认10MB）
  max_bytes: 10485760

  # 保留的日志备份数量
  backup_count: 3

# ============================================================================
# 其他配置预留
# ============================================================================
# future:
#   代理配置
#   速度限制
#   通知设置
